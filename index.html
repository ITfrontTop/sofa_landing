<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sofa</title>

    <link rel="stylesheet" href="/src/styles/main.scss" />

    <script src="/src/js/main.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__wrapper">
          <div class="search">
            <form class="search__form" action="#">
              <input
                class="search__input"
                type="search"
                name="searchName"
                placeholder="Brown leather Sofa"
              />
              <button class="search__btn" type="submit">
                <svg class="search__btn-icon">
                  <use href="./src/assets/icons/sprite.svg#search-icon"></use>
                </svg>
              </button>
            </form>
          </div>
          <nav class="nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a class="nav__item-link" href="#">Home</a>
              </li>
              <li class="nav__item">
                <a class="nav__item-link" href="#">Sofas</a>
              </li>
              <li class="nav__item">
                <a class="nav__item-link" href="#">Visualizer</a>
              </li>
              <li class="nav__item">
                <a class="nav__item-link" href="#">Us</a>
              </li>
            </ul>
          </nav>
          <div class="header__box">
            <div class="delivery">
              <form class="delivery__form" action="#">
                <input
                  class="delivery__input"
                  type="text"
                  placeholder="Track my order"
                />
                <button class="delivery__btn">
                  <svg class="delivery__icon">
                    <use
                      href="./src/assets/icons/sprite.svg#delivery-icon"
                    ></use>
                  </svg>
                </button>
              </form>
            </div>
            <div class="card">
              <svg class="card__icon">
                <use href="./src/assets/icons/sprite.svg#card-icon"></use>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="main"></main>
    <footer class="footer"></footer>
  </body>
</html>
